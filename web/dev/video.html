<!doctype html>
<!--
  W2's acceptance page, and nothing more: a canvas, two EventSources, and a hand-written port of
  `src/web/video.rs`'s decoder. No build step, no dependencies — open http://localhost:8080 while
  `gb serve --policy random` is running and the game should be playing.

  W3 replaces this with the Vite/React SPA and deletes the file. Do not grow it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>gb — video pipeline (dev)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14161a; color: #d7dae0;
         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         display: flex; gap: 24px; padding: 24px; flex-wrap: wrap; }
  canvas { image-rendering: pixelated; width: 640px; height: 576px;
           background: #000; border: 1px solid #2a2e35; }
  #side { min-width: 320px; flex: 1; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 16px; margin: 0 0 20px; }
  dt { color: #7d838f; }
  dd { margin: 0; }
  #log { height: 380px; overflow-y: auto; border: 1px solid #2a2e35; padding: 8px; }
  .agent { color: #8fd48f; }
  .notice { color: #e0a35c; }
</style>
</head>
<body>
<canvas id="screen" width="160" height="144"></canvas>
<div id="side">
  <dl>
    <dt>video</dt><dd id="video">connecting…</dd>
    <dt>map</dt><dd id="map">—</dd>
    <dt>position</dt><dd id="position">—</dd>
    <dt>mode</dt><dd id="mode">—</dd>
    <dt>agent</dt><dd id="agent">—</dd>
    <dt>speed</dt><dd id="speed">—</dd>
  </dl>
  <div id="log"></div>
</div>
<script>
const BLOCK = 8, BLOCKS_X = 20, BLOCKS_Y = 18, BLOCK_COUNT = BLOCKS_X * BLOCKS_Y;
const WIDTH = 160, HEIGHT = 144, BLOCK_PIXELS = BLOCK * BLOCK;
const VERSION = 1, FLAG_KEYFRAME = 1, MODE_RLE = 0, MODE_RAW = 1, MODE_PACKED = 2;

const canvas = document.getElementById('screen');
const context = canvas.getContext('2d');
const image = context.createImageData(WIDTH, HEIGHT);
image.data.fill(255);

// The decoder's whole state: a palette that persists across messages (replaced outright by a
// keyframe, appended to by a delta) and the canvas itself, which holds the pixels.
let palette = [];
let messages = 0, bytes = 0;

function apply(buffer) {
  const data = new DataView(buffer);
  let at = 0;
  const u8 = () => data.getUint8(at++);
  const u16 = () => { const v = data.getUint16(at, true); at += 2; return v; };

  if (u8() !== VERSION) throw new Error('unsupported version');
  const keyframe = (u8() & FLAG_KEYFRAME) !== 0;
  const seq = u16();

  const paletteLength = u8();
  if (keyframe) palette = [];
  for (let i = 0; i < paletteLength; i++) palette.push([u8(), u8(), u8()]);

  const blocks = u16();
  const indices = new Uint8Array(BLOCK_PIXELS);
  for (let b = 0; b < blocks; b++) {
    const block = u16();
    const mode = u8();
    if (mode === MODE_RLE) {
      let slot = 0;
      while (slot < BLOCK_PIXELS) {
        const run = u8(), index = u8();
        indices.fill(index, slot, slot + run);
        slot += run;
      }
    } else if (mode === MODE_RAW) {
      for (let i = 0; i < BLOCK_PIXELS; i++) indices[i] = u8();
    } else if (mode === MODE_PACKED) {
      // Four palette indices, then 2 bits per pixel into them, low bits first.
      const sub = [u8(), u8(), u8(), u8()];
      for (let i = 0; i < BLOCK_PIXELS; i += 4) {
        const bits = u8();
        for (let j = 0; j < 4; j++) indices[i + j] = sub[(bits >> (j * 2)) & 3];
      }
    } else {
      throw new Error('unknown block mode ' + mode);
    }
    const x0 = (block % BLOCKS_X) * BLOCK, y0 = ((block / BLOCKS_X) | 0) * BLOCK;
    for (let dy = 0; dy < BLOCK; dy++) {
      for (let dx = 0; dx < BLOCK; dx++) {
        const colour = palette[indices[dy * BLOCK + dx]];
        const offset = ((y0 + dy) * WIDTH + x0 + dx) * 4;
        image.data[offset] = colour[0];
        image.data[offset + 1] = colour[1];
        image.data[offset + 2] = colour[2];
      }
    }
  }
  // One putImageData per message, not per block.
  context.putImageData(image, 0, 0);
  return { seq, keyframe };
}

function base64ToBytes(text) {
  const binary = atob(text);
  const out = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
  return out.buffer;
}

const video = new EventSource('/api/video');
video.onmessage = (message) => {
  const buffer = base64ToBytes(message.data);
  const { seq, keyframe } = apply(buffer);
  messages++; bytes += buffer.byteLength;
  document.getElementById('video').textContent =
    `seq ${seq}${keyframe ? ' (key)' : ''} · ${messages} msgs · ${(bytes / 1024).toFixed(1)} KiB`;
};
video.onerror = () => { document.getElementById('video').textContent = 'reconnecting…'; };

const log = document.getElementById('log');
const events = new EventSource('/api/events');
events.onmessage = (message) => {
  const event = JSON.parse(message.data);
  if (event.type === 'status') {
    const game = event.game;
    document.getElementById('map').textContent = game ? game.map : '(unreadable)';
    document.getElementById('position').textContent = game ? `${game.position.x}, ${game.position.y}` : '—';
    document.getElementById('mode').textContent = game ? game.mode : '—';
    document.getElementById('agent').textContent = event.agent_state;
    document.getElementById('speed').textContent =
      `${event.target_speed}× target · ${(event.emulated_ms / 1000).toFixed(1)}s emulated / ${(event.wall_ms / 1000).toFixed(1)}s wall`;
    return;
  }
  const line = document.createElement('div');
  line.className = event.type === 'agent' ? 'agent' : 'notice';
  line.textContent = event.type === 'agent' ? `${event.kind}  ${event.text}` : `[${event.level}] ${event.message}`;
  const pinned = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  log.appendChild(line);
  while (log.childElementCount > 400) log.removeChild(log.firstChild);
  if (pinned) log.scrollTop = log.scrollHeight;
};
</script>
</body>
</html>
