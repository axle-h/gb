# Builds the container from a bare checkout, proves the thing it produced actually runs, and — on
# main only — publishes it to ghcr.io/axle-h/gb for `k8s/` to pull.
#
# The build is the whole of `Dockerfile` — rgbds from source, `pokered.gbc` checked against
# upstream's sha1, the SPA, then the crate — so a green run here means the four stages still compose
# on a machine that has none of this project's build artifacts lying around. That is a different
# claim from `cargo test`, which runs against a working tree where the ROM and `web/dist` already
# exist, and it is the one that rots silently.
#
# ⚠️ **`submodules: recursive` is load-bearing.** `pokered/` is a submodule and an uninitialised one
# is an empty directory; stage 1 catches that deliberately (`test -f main.asm`) rather than letting
# `make` fail with "No rule to make target 'main.asm'", but only the checkout below stops it
# happening at all.
name: container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first build irrelevant — building both wastes ~15
# minutes of a runner for an answer nobody will read.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # ⚠️ This is what lets GITHUB_TOKEN push to ghcr.io, and it is per-workflow: the repository's
  # default token permissions (Settings → Actions → General) can be read-only and this still works,
  # because the `permissions:` key sets the token's scopes for this workflow rather than inheriting
  # them. What it cannot do is make the published package *public* — that is a one-off in the
  # package's own settings, after the first push creates it. See `k8s/README.md`.
  packages: write

# The registry path is derived, not typed: `github.repository` is `axle-h/gb`, so this is
# `ghcr.io/axle-h/gb` — the same string `k8s/gb/deployment.yml` pulls.
env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Stage 1 compiles rgbds and assembles the ROM, stage 3 is a release build of the crate; both
    # are minutes even when warm, and the default 6 h timeout would let a hang burn the afternoon.
    timeout-minutes: 60

    steps:
      # Major-version tags, so what this job runs is legible at a glance and picks up patches on its
      # own. ⚠️ The trade-off is real and worth knowing rather than forgetting: a tag is mutable, so
      # this trusts the action's owner not to move it — pinning by commit SHA is what removes that
      # trust, at the cost of a version nobody can read.
      - name: Check out, with the pokered submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # ⚠️ Not "install buildx" — the runner already has it. This creates a builder on the
      # `docker-container` driver, which the GHA cache below requires: the default `docker` driver
      # cannot export cache at all ("Cache export is not supported for the docker driver"). Remove
      # the caching and this step, and `docker build` on its own is enough.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # What `GET /version` serves and what the startup line prints. The binary cannot know any of
      # it: `CARGO_PKG_VERSION` is in the crate, but "when" and "from what" only exist out here.
      #
      # ⚠️ **`github.head_ref || github.ref_name`, in that order.** On a pull request `ref_name` is
      # the synthetic `123/merge`, which names no branch anyone has; `head_ref` is the branch the PR
      # came from and is empty on a push. Same story one line down: `github.sha` on a PR is the merge
      # commit, so the head SHA is the one that identifies what was built. Neither case reaches the
      # registry — the push steps are main-only — but the smoke test below reads this back, and a
      # value that is only ever right on main is a value nobody can trust on a PR.
      - name: Work out what we are building
        id: build_info
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          {
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "branch=$BRANCH"
            # Seven characters: git's own default minimum, and the prefix of the full SHA the image
            # is tagged with, so one pastes into `git show` and greps the other.
            echo "sha=$(printf '%s' "$REVISION" | cut -c1-7)"
            echo "revision=$REVISION"
          } >> "$GITHUB_OUTPUT"

      # ⚠️ `type=gha` caches **layers**, not BuildKit cache mounts. The cargo registry, the cargo
      # target directory and the pnpm store are all `--mount=type=cache` and start empty on every
      # runner, so an invalidated stage 3 pays a full cold `cargo build --release`. What the cache
      # does buy is the two expensive stages that rarely change: a run that touches only `src/`
      # reuses rgbds, the ROM and the SPA rather than rebuilding them.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true          # into the runner's docker, so the smoke test below can run it
          tags: gb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ⚠️ These are consumed in the *runtime* stage, below the `COPY` of the binary — see the
          # ⚠️ in the Dockerfile. `GB_BUILD_DATE` changes on every run, so an arg the cargo stage
          # read would mean a full cold `cargo build --release` every time this workflow fires.
          build-args: |
            GB_BUILD_DATE=${{ steps.build_info.outputs.date }}
            GB_GIT_BRANCH=${{ steps.build_info.outputs.branch }}
            GB_GIT_SHA=${{ steps.build_info.outputs.sha }}
            GB_GIT_REVISION=${{ steps.build_info.outputs.revision }}

      # An image that builds is not the claim worth making — the interesting failures are an empty
      # `web/dist` baked in, or a ROM the Pokémon layer cannot read, and both build perfectly.
      #
      # `--policy random` is what makes this runnable in CI at all: it is the one policy that needs
      # no OPENAI_API_KEY and spends nothing. The argv is the full command because `CMD` is exec form
      # with no `ENTRYPOINT`, so overriding it replaces the lot.
      - name: Start the container
        run: |
          docker run -d --name gb-ci -p 8080:8080 gb:ci gb serve --policy random --new-run

      - name: It serves, it embedded the SPA, and it is emulating
        run: |
          set -euo pipefail

          # HEALTHCHECK allows a 20 s start period; the emulator boots the ROM before the first
          # frame is published, so poll rather than sleep on a guess.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/healthz >/dev/null 2>&1; then break; fi
            if [ "$i" = 60 ]; then echo "::error::/api/healthz never came up"; exit 1; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/healthz

          # The injection above actually reached the image. This is the one thing about /version
          # that can break silently: the endpoint answers either way, with nulls where the build
          # args did not arrive, and an image that cannot say which commit it is looks perfectly
          # healthy right up until someone needs to know.
          curl -fsS -o version.json http://localhost:8080/version
          cat version.json
          python3 - <<'PY'
          import json, sys
          got = json.load(open("version.json"))
          missing = [k for k in ("version", "build_date", "branch", "commit") if not got.get(k)]
          if missing:
              print(f"::error::/version did not receive {', '.join(missing)} — check the build-args")
              sys.exit(1)
          PY
          test "$(python3 -c 'import json;print(json.load(open("version.json"))["commit"])')" \
            = "${{ steps.build_info.outputs.sha }}" \
            || { echo "::error::/version reports a commit that is not the one we built"; exit 1; }

          # Stage 2 landed in the binary. The failure this catches is a *successful* build with an
          # empty web/dist, which serves the "UI is not built" placeholder instead of the SPA.
          index=$(curl -fsS http://localhost:8080/)
          case "$index" in
            *'id="root"'*) echo "the SPA is embedded" ;;
            *) echo "::error::/ served the not-built placeholder — stage 2 did not reach the binary"
               printf '%s\n' "$index" | head -20; exit 1 ;;
          esac

          # Stage 1 landed too, and is readable as a *cartridge* rather than as bytes: all three of
          # these are decoded out of the ROM at runtime, and nothing pictorial is committed to the
          # repo. The Pokémon sprite is the one worth having here — it is *decompressed* rather than
          # merely sliced, and the container is exactly where its `.2bpp` oracle is absent
          # (.dockerignore excludes them), so this is the only place that decompressor runs in CI.
          for path in api/badges.png api/pokemon/1/front.png favicon.png; do
            curl -fsS -o rom.png "http://localhost:8080/$path"
            file rom.png | grep -q 'PNG image data' \
              || { echo "::error::/$path is not a PNG — the ROM did not decode"; exit 1; }
          done

          # And the emulator is actually running: video_seq is null until the first keyframe is
          # published, so a non-null value means frames are being produced, not merely that axum
          # answered.
          for i in $(seq 1 30); do
            seq=$(curl -fsS http://localhost:8080/api/healthz | python3 -c 'import json,sys; print(json.load(sys.stdin)["video_seq"])')
            [ "$seq" != "None" ] && { echo "emulating — video_seq=$seq"; exit 0; }
            sleep 2
          done
          echo "::error::no video keyframe was ever published — the emulator thread is not running"
          exit 1

      # ── publish ────────────────────────────────────────────────────────────────────────────────
      #
      # Everything below runs only after the smoke test above has passed, which is the whole point
      # of the ordering: what reaches the registry is the exact image that was proven to serve the
      # SPA, decode the cartridge and emulate. A build-and-push that runs in parallel with its own
      # tests publishes whatever it made and finds out afterwards.
      #
      # ⚠️ Main only. A pull request from a fork gets a read-only GITHUB_TOKEN — `packages: write`
      # above cannot grant what the fork's token never had — so without this guard every fork PR
      # would fail on a login it was never going to be allowed to do.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # Through the environment rather than interpolated into the command: `${{ }}` inside `run:`
        # is substituted into the script text before bash sees it, so a secret used that way is one
        # `set -x` away from the log.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # `docker tag` + `docker push` of the image already in the runner's docker, rather than a
      # second `build-push-action` with `push: true`. The second build would be a near-total cache
      # hit and is the more common pattern, but this pushes bytes that have demonstrably run — there
      # is no step between the test and the registry that could produce a different image.
      #
      # Two tags: `latest`, which `k8s/gb/deployment.yml` pulls with `imagePullPolicy: Always`, and
      # the commit, which is the only one that can be rolled back to or pinned.
      - name: Push it
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker tag gb:ci "$IMAGE:latest"
          docker tag gb:ci "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          echo "### Pushed \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```shell' >> "$GITHUB_STEP_SUMMARY"
          echo "kubectl -n gb set image deploy/gb gb=$IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The container's own stdout is where the agent reports what it did, so it is the first thing
      # worth having when any of the above fails.
      - name: Container logs
        if: always()
        run: docker logs gb-ci 2>&1 | tail -100

      - name: Stop it
        if: always()
        run: docker rm -f gb-ci >/dev/null 2>&1 || true
