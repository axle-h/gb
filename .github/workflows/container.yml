# Builds the image from a bare checkout, smoke-tests the running container, and on main pushes it
# to ghcr.io for `k8s/` to pull. `submodules: recursive` is required: pokered is a submodule.
name: container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the older build irrelevant.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Lets GITHUB_TOKEN push to ghcr.io whatever the repository default; making the package public is a
  # one-off in its settings (see `k8s/README.md`).
  packages: write

# `ghcr.io/axle-h/gb`, the image `k8s/gb/deployment.yml` pulls.
env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Major-version tags are mutable; pinning by commit SHA would remove that trust.
      - name: Check out, with the pokered submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # A `docker-container` builder, which the GHA cache requires.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # The build stamp `GET /version` serves. On a PR, `ref_name` and `github.sha` name the synthetic
      # merge, so the head branch and head SHA come first.
      - name: Work out what we are building
        id: build_info
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          {
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "branch=$BRANCH"
            # The prefix of the full SHA the image is tagged with.
            echo "sha=$(printf '%s' "$REVISION" | cut -c1-7)"
            echo "revision=$REVISION"
          } >> "$GITHUB_OUTPUT"

      # `type=gha` caches layers, not BuildKit cache mounts, so an invalidated cargo stage builds cold.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true          # into the runner's docker, so the smoke test below can run it
          tags: gb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Consumed in the runtime stage only: `GB_BUILD_DATE` changes every run, so the cargo stage
          # must not read them.
          build-args: |
            GB_BUILD_DATE=${{ steps.build_info.outputs.date }}
            GB_GIT_BRANCH=${{ steps.build_info.outputs.branch }}
            GB_GIT_SHA=${{ steps.build_info.outputs.sha }}
            GB_GIT_REVISION=${{ steps.build_info.outputs.revision }}

      # `--policy random` needs no API key. `CMD` is exec form with no `ENTRYPOINT`, so the argv is
      # the whole command.
      - name: Start the container
        run: |
          docker run -d --name gb-ci -p 8080:8080 gb:ci poke-agent-web --policy random --new-run

      - name: It serves, it embedded the SPA, and it is emulating
        run: |
          set -euo pipefail

          # The emulator boots the ROM before the first frame, so poll rather than sleep.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/healthz >/dev/null 2>&1; then break; fi
            if [ "$i" = 60 ]; then echo "::error::/api/healthz never came up"; exit 1; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/healthz

          # /version answers either way, with nulls where the build args did not arrive.
          curl -fsS -o version.json http://localhost:8080/version
          cat version.json
          python3 - <<'PY'
          import json, sys
          got = json.load(open("version.json"))
          missing = [k for k in ("version", "build_date", "branch", "commit") if not got.get(k)]
          if missing:
              print(f"::error::/version did not receive {', '.join(missing)} — check the build-args")
              sys.exit(1)
          PY
          test "$(python3 -c 'import json;print(json.load(open("version.json"))["commit"])')" \
            = "${{ steps.build_info.outputs.sha }}" \
            || { echo "::error::/version reports a commit that is not the one we built"; exit 1; }

          # A successful build with an empty web/dist serves the "UI is not built" placeholder.
          index=$(curl -fsS http://localhost:8080/)
          case "$index" in
            *'id="root"'*) echo "the SPA is embedded" ;;
            *) echo "::error::/ served the not-built placeholder — stage 2 did not reach the binary"
               printf '%s\n' "$index" | head -20; exit 1 ;;
          esac

          # Decoded from the ROM at run time. The sprite is decompressed, and its `.2bpp` oracle is
          # excluded from the context, so this is the only place that decompressor runs in CI.
          for path in api/badges.png api/pokemon/1/front.png favicon.png; do
            curl -fsS -o rom.png "http://localhost:8080/$path"
            file rom.png | grep -q 'PNG image data' \
              || { echo "::error::/$path is not a PNG — the ROM did not decode"; exit 1; }
          done

          # video_seq is null until the first keyframe, so non-null means frames are being produced.
          emulating=""
          for i in $(seq 1 30); do
            seq=$(curl -fsS http://localhost:8080/api/healthz | python3 -c 'import json,sys; print(json.load(sys.stdin)["video_seq"])')
            [ "$seq" != "None" ] && { echo "emulating — video_seq=$seq"; emulating=1; break; }
            sleep 2
          done
          [ -n "$emulating" ] \
            || { echo "::error::no video keyframe was ever published — the emulator thread is not running"; exit 1; }

          # A real Opus packet through the real route. `--max-time` on an endless stream exits 28,
          # so the bytes are judged rather than the status.
          curl -sS --max-time 5 -o audio.bin http://localhost:8080/api/audio || true
          python3 - <<'PY' || exit 1
          import struct, sys
          data = open("audio.bin", "rb").read()
          at, messages = 0, []
          while at + 4 <= len(data):
              n = struct.unpack_from("<I", data, at)[0]
              at += 4
              if at + n > len(data):
                  break
              messages.append(data[at:at + n])
              at += n
          if not messages or messages[0][:4] != b"GBA1":
              sys.exit("::error::/api/audio did not open with a GBA1 header")
          packets = [m for m in messages[1:] if m]
          if not packets:
              sys.exit("::error::/api/audio sent a header and no Opus packets")
          # RFC 6716 section 3.1: the TOC's low two bits are the frame count code, and we send one per packet.
          if any(p[0] & 3 for p in packets):
              sys.exit("::error::/api/audio packets are not single-frame Opus")
          print(f"audio — {len(packets)} Opus packets, {sum(map(len, packets))} bytes")
          PY
          exit 0

      # Publish: runs only after the smoke test passed, and only on main, since a fork PR's token is
      # read-only whatever `permissions:` asks for.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        # Through the environment, since `${{ }}` in `run:` is substituted into the script text.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Pushes the exact image the smoke test ran. `latest` is what `k8s/` pulls; the commit tag is
      # the one to pin or roll back to.
      - name: Push it
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker tag gb:ci "$IMAGE:latest"
          docker tag gb:ci "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          echo "### Pushed \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```shell' >> "$GITHUB_STEP_SUMMARY"
          echo "kubectl -n gb set image deploy/gb gb=$IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The container's stdout is where the agent reports what it did.
      - name: Container logs
        if: always()
        run: docker logs gb-ci 2>&1 | tail -100

      - name: Stop it
        if: always()
        run: docker rm -f gb-ci >/dev/null 2>&1 || true
