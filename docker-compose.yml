#   OPENAI_API_KEY=sk-… GB_MODEL=… docker compose up -d --build
#   docker compose run --rm --service-ports gb poke-agent-web --policy random   # no key, no spend

services:
  gb:
    build: .
    image: gb:latest
    ports:
      - "${GB_PUBLISH_PORT:-8080}:8080"
    environment:
      # Required for the default `--policy llm`; `?` fails a missing one at `up`.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY, or run with --policy random}
      GB_MODEL: ${GB_MODEL:?set GB_MODEL, or run with --policy random}
      # Everything below is optional; `poke-agent/src/llm/config.rs` documents the defaults.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GB_CONTEXT_LIMIT: ${GB_CONTEXT_LIMIT:-}
      GB_TEMPERATURE: ${GB_TEMPERATURE:-}
      GB_MAX_TOOL_STEPS: ${GB_MAX_TOOL_STEPS:-}
      GB_STATUS_HZ: ${GB_STATUS_HZ:-}
      # The watchdog, in emulated seconds; `0` turns it off.
      GB_STUCK_TIMEOUT_SECS: ${GB_STUCK_TIMEOUT_SECS:-}
    volumes:
      - runs:/runs
    restart: unless-stopped
    # SIGTERM checkpoints the run, so the grace period must exceed the checkpoint time.
    stop_grace_period: 30s

volumes:
  runs:
