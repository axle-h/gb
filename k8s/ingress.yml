# TLS terminates here. `/api/events` and `/api/video` stream for the life of the page, so any proxy
# in this path must forward unbuffered with no response timeout.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    kubernetes.io/ingress.class: traefik
    # <namespace>-<middleware>@kubernetescrd — so this only resolves if the namespace really is `gb`.
    traefik.ingress.kubernetes.io/router.middlewares: gb-redirect-http-https@kubernetescrd
  name: gb
  labels:
    app: gb
spec:
  rules:
    - host: "gb.ax-h.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: gb
                port:
                  name: http
  tls:
    - hosts:
        - gb.ax-h.com
      secretName: gb-axh-com-tls
