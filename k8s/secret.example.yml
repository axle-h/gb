# The values that have to be secret — a **template**, never applied as it stands.
#
# ⚠️ **It lives here rather than in `gb/` so that a directory apply cannot reach it.** Everything in
# `gb/` goes on with one `kubectl apply -f ./gb`, so placeholders sitting in there would blank the
# real key and the real admin token on every re-apply of the deployment. Copy it in, filled:
#
#   cp ./secret.example.yml ./gb/secret.axh.yml   # gitignored, and applied with the rest of ./gb
#
# `gb serve --policy random` needs neither this nor a model, and is the way to check the page, the
# video pipeline and the volume without spending anything.
apiVersion: v1
kind: Secret
metadata:
  name: gb
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-..."

  # Enables starting the game over in a fresh run directory without restarting the pod — the
  # alternative to a `--new-run` rollout, which needs two manifest edits and is easy to leave in
  # place (where it would wipe the run on *every* restart). Two doors onto the same thing:
  #
  #   https://gb.ax-h.com/reset-game            in a browser; any user name, this as the password
  #   curl -X POST -H "X-GB-Token: $GB_ADMIN_TOKEN" https://gb.ax-h.com/api/new-run
  #
  # ⚠️ Leave it out and both 404, which is the right default: the ingress is public. A
  # *blank* value counts as unset for the same reason, so a placeholder here cannot accidentally open
  # it. Generate one with `openssl rand -hex 32`.
  GB_ADMIN_TOKEN: ""
