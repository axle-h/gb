# A template, never applied as it stands; it lives outside `gb/` so `kubectl apply -f ./gb` cannot
# blank the real values. Copy it in filled: `cp ./secret.example.yml ./gb/secret.axh.yml` (gitignored).
apiVersion: v1
kind: Secret
metadata:
  name: gb
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-..."

  # Enables `/reset-game` and `POST /api/new-run`; unset or blank, both 404.
  # Generate one with `openssl rand -hex 32`.
  GB_ADMIN_TOKEN: ""
