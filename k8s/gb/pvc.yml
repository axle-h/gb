# A run's entire state is one directory: `$GB_RUN_DIR/<run-id>/` holding meta.json, state.gbst,
# sram.bin, transcript.jsonl, the model's own todo.json, and the conversation it is having with the
# endpoint (history.json and conversation.jsonl, `src/llm/history.rs`). Lose it and the playthrough
# starts over from the title screen; keep it and `gb serve` resumes the newest run in it on every
# start, notes and conversation alike.
#
# `local-path` is k3s's built-in provisioner and pins the volume to the node it was first scheduled
# on. That is exactly what is wanted here — the run is single-writer and there is one replica — but
# it does mean the pod cannot move nodes without the data staying behind.
#
# Two files grow without bound, and "a few MB per playthrough" was an underestimate: a four-day LLM
# run reached 162 MB of transcript live with a 268 MB rotated file beside it, 437 MB for the
# directory. conversation.jsonl grows beside it and is roughly an order of magnitude smaller — the
# transcript's bulk is one event per streamed token, while that file has one line per *message* — so
# it is tens of MB over a playthrough rather than hundreds. Both rotate at the same 256 MB. 10Gi
# leaves room for all of it.
#
# ⚠️ **This number is nominal, and raising it here does not resize a claim that already exists.**
# `local-path` sets no `allowVolumeExpansion`, so the API server refuses an edit to a bound PVC —
# the only way to change a live one is to delete and recreate it, and the PV's reclaim policy is
# `Delete`, so that takes the run's directory with it. What actually limits a run is the node's
# disk (930G here), which nothing in this file constrains; the request is a scheduling hint and a
# statement of intent for the next cluster this is applied to.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runs
  labels:
    app: gb
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
