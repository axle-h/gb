# The run directory: lose it and the playthrough starts over. `local-path` pins it to one node.
# `local-path` cannot expand a bound claim, so raising `storage` needs a delete, which deletes the run.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runs
  labels:
    app: gb
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
