# The tuning knobs, each optional; `poke-agent/src/llm/config.rs` documents the defaults. The API keys
# are in the gitignored `gb/secret.axh.yml`, templated by `../secret.example.yml`.
# `envFrom` is read at process start, so an edit here needs `kubectl -n gb rollout restart deploy/gb`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gb
data:
  # What plays the game; unset means `llm`. `--policy` on the container's args overrides it.
  #   llm            a model over the endpoint below; billed, and needs a valid key in the Secret
  #   random         random legal choices; no key, no spend, exercises the whole stack
  #   deterministic  the `full_playthrough` route at 1x; wants a fresh game (`../new-run.sh`)
  GB_POLICY: "llm"

  # `anthropic` is the Messages API with the Secret's ANTHROPIC_API_KEY; `openai` (the default) is any
  # OpenAI-compatible endpoint at OPENAI_BASE_URL with its OPENAI_API_KEY.
  GB_PROVIDER: "anthropic"
  GB_MODEL: "claude-haiku-5-5"
  # Anthropic's effort, `low` to `max`; billed thinking grows with it.
  GB_REASONING_EFFORT: "high"

  # What is played: `emulated`, the cartridge, or `native`, the recreation. A run is resumed only by
  # a process playing its kind, so changing this starts a new game.
  GB_GAME: "native"

  # Tokens of history carried before compacting. Haiku 5.5's window is 1M, but its input price
  # quintuples past a 100k prompt, so the history stays under that.
  GB_CONTEXT_LIMIT: "100000"
  # How full the window gets before compacting; the headroom must fit an in-flight turn and the summary.
  GB_COMPACT_ABOVE: "0.85"
  GB_MAX_TOOL_STEPS: "16"

  # A timeout is not retried, so this is well above the 180 default.
  GB_REQUEST_TIMEOUT_SECS: "600"

  # Ceiling on one completion, so a repetition loop cannot run until the context window fills. The
  # thinking counts towards it.
  GB_MAX_TOKENS: "16000"

  # Emulated seconds with no decision point before the model is asked for a nudge; `0` turns it off.
  GB_STUCK_TIMEOUT_SECS: "300"

  # The status heartbeat's sample rate; it is published only on change.
  GB_STATUS_HZ: "2"

  # The Opus stream's bitrate in bits/s; `0` turns audio off. Nothing is encoded until a viewer listens.
  GB_AUDIO_BITRATE: "24000"

  # Which Game Boy the cartridge runs on. `cgb` is compatibility mode: same game, red-tinted palette,
  # and a video stream at 4 bits per pixel rather than 2.
  GB_HARDWARE: "cgb"
