# The values that have to be secret. Fill them in and apply, or keep the real ones out of git the
# way the other repos do — copy this to `secret.axh.yml` (gitignored) and apply that instead:
#
#   kubectl -n gb apply -f ./gb/secret.axh.yml
#
# `gb serve --policy random` needs neither this nor a model, and is the way to check the page, the
# video pipeline and the volume without spending anything.
apiVersion: v1
kind: Secret
metadata:
  name: gb
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-..."

  # Enables `POST /api/new-run`, which starts the game over in a fresh run directory without
  # restarting the pod — the alternative to a `--new-run` rollout, which needs two manifest edits and
  # is easy to leave in place (where it would wipe the run on *every* restart).
  #
  #   curl -X POST -H "X-GB-Token: $GB_ADMIN_TOKEN" https://gb.ax-h.com/api/new-run
  #
  # ⚠️ Leave it out and the endpoint 404s, which is the right default: the ingress is public. A
  # *blank* value counts as unset for the same reason, so a placeholder here cannot accidentally open
  # it. Generate one with `openssl rand -hex 32`.
  GB_ADMIN_TOKEN: ""
