apiVersion: apps/v1
kind: Deployment
metadata:
  name: gb
  labels:
    app: gb
spec:
  # One replica, because a run directory has exactly one writer.
  replicas: 1
  # Recreate, because a rolling update would start a second writer before the old pod has
  # finished its SIGTERM checkpoint.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gb
  template:
    metadata:
      labels:
        app: gb
    spec:
      # Otherwise Kubernetes injects `GB_PORT=tcp://<clusterIP>:80` for the `gb` Service, which
      # `gb` reads as its listen port and exits on.
      enableServiceLinks: false
      # `fsGroup` makes the mounted volume writable by the image's uid 10001.
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
        - name: runs
          persistentVolumeClaim:
            claimName: runs
      # SIGTERM checkpoints the run, so the grace period must exceed the checkpoint time.
      terminationGracePeriodSeconds: 30
      containers:
        - name: gb
          image: ghcr.io/axle-h/gb:latest
          imagePullPolicy: Always
          # The policy is `GB_POLICY` in `configmap.yml`; `--policy` here would override it.
          # This resumes the newest run; `--new-run` here would wipe the run on every restart.
          args: ["poke-agent-web"]
          envFrom:
            - configMapRef:
                name: gb
            - secretRef:
                name: gb
          volumeMounts:
            - name: runs
              mountPath: /runs
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              # The emulator thread runs flat out, so it wants a core to itself.
              cpu: "1"
              memory: 256Mi
            limits:
              # No CPU limit: a CFS quota shows up as the game running slow, not as a resource error.
              memory: 2Gi
          # Keeps liveness from counting against the resume at startup.
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Proves the HTTP server only; a wedged run is caught by the in-process watchdog,
          # and a restart would resume into the same jam.
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
