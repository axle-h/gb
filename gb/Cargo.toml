[package]
name = "gb"
version = "1.0.0"
edition = "2024"
description = "A Game Boy and Game Boy Color emulator."

[features]
# The throughput benches, which run for tens of seconds each.
slow-tests = []

[dependencies]
bincode = "2.0.1"
bitflags = "2.9.3"
image = "0.25"
lz4_flex = "0.11"
paste = "1.0"
# The joypad tape, which the oracle commits as a fixture.
serde = { version = "1.0", features = ["derive"] }
strum = "0.27"
strum_macros = "0.27.2"

[dev-dependencies]
serde_json = "1.0"
