[package]
name = "poke-core"
version = "1.0.0"
edition = "2024"
description = "Pokémon Red's data, decoded from the cartridge: shared by the agent and the native game."

[features]
# The ROM-wide sweeps.
slow-tests = []

[dependencies]
bitflags = "2.9.3"
itertools = "0.14"
serde = { version = "1.0", features = ["derive"] }
strum = "0.27"
strum_macros = "0.27.2"
unicode-segmentation = "1.12.0"

[build-dependencies]
regex = "1.12.2"
