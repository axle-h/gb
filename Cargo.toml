[package]
name = "gb"
version = "0.1.0"
edition = "2024"

[features]
# Opt-in for the full ~2h `can_start_game` end-to-end playthrough. Off by default so it doesn't run
# on a normal `cargo test`; enable with `cargo test --release --features slow-tests can_start_game`.
slow-tests = []

[dependencies]
strum = "0.27"
strum_macros = "0.27.2"
paste = "1.0"
sdl2 = { version = "0.38" }
image = "0.25"
itertools = "0.14"
fontdue = "0.9.3"
bitflags = "2.9.3"
rubato = "1.0.0-preview.0"
audioadapter = "0.5.0"
bincode = "2.0.1"
lz4_flex = "0.11"
unicode-segmentation = "1.12.0"
rand = "0.10.0-rc.0"
phf = { version = "0.13.1", features = ["macros"] }

[build-dependencies]
regex = "1.12.2"
