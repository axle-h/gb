[workspace]
members = ["gb", "poke-agent", "poke-agent-sdl", "poke-agent-web"]
resolver = "3"

# The integration tests are bound by raw emulation speed; these two make every test faster at once.
[profile.release]
lto = "thin"
codegen-units = 1

# The default test tier has to be runnable in dev mode, and it emulates every frame. `poke-agent`
# is here as well as `gb` because unoptimised agent frames overflow the test harness's stack.
[profile.dev.package.gb]
opt-level = 3

[profile.dev.package.poke-agent]
opt-level = 3

# The mock endpoint the agent's own tests talk to is real HTTP over axum and tokio, and the emulator
# keeps running while it answers — so an unoptimised dependency is paid for in emulated game time.
[profile.dev.package."*"]
opt-level = 2
