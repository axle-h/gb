[package]
name = "gb"
version = "0.1.0"
edition = "2024"

[features]
# The Pokémon integration tests are tiered by how much game time they emulate. The emulator runs at
# ~23x realtime, so game time is the cost: a plain `cargo test --release` stays under a minute by
# running only the mechanic tests and two navigation smoke tests.
#
# Every per-badge leg test (`can_reach_vermilion` … `can_enter_hall_of_fame`), each seeded from a
# committed `src/pokemon/data/*.bin` snapshot.
#   cargo test --release --features slow-tests
slow-tests = []
# `full_playthrough` alone — a fresh save played to all 8 badges and Victory Road 2F (NOT the Hall of
# Fame: the Elite Four is proved separately), ~20 min of wall clock. Kept off the `slow-tests` gate so
# the leg chain can be run without paying for it. Run it after every major work item and before pushing
# — it is the only test that proves the legs compose. See CLAUDE.md.
#   cargo test --release --features full-playthrough full_playthrough
full-playthrough = []
# Benchmarks. Compiled out entirely by default rather than `#[ignore]`d, so they do not show up
# in the ignored count alongside genuinely blocked tests.
#   cargo test --release --features bench --bin gb -- bench_ --nocapture
bench = []
# Let tests overwrite the committed fixtures they snapshot. Off by default: a normal test run must
# leave the working tree clean, or every run silently changes the next run's inputs.
#   cargo test --release --features regen-fixtures,slow-tests
regen-fixtures = []

[dependencies]
strum = "0.27"
strum_macros = "0.27.2"
paste = "1.0"
sdl2 = { version = "0.38" }
image = "0.25"
itertools = "0.14"
fontdue = "0.9.3"
bitflags = "2.9.3"
bincode = "2.0.1"
lz4_flex = "0.11"
unicode-segmentation = "1.12.0"
rand = "0.10.0-rc.0"
phf = { version = "0.13.1", features = ["macros"] }

[build-dependencies]
regex = "1.12.2"

# The integration tests are bound by raw emulation speed — the agent's observe/policy/input work is
# only ~16% on top of it — so these two are the only knob that makes every test faster at once.
# Re-measured 2026-08-05 after Phase A: 33.6x realtime raw, 28.3x with the agent. `-C
# target-cpu=native` was tried on top of this and made it *slower*, so it is deliberately not set.
[profile.release]
lto = "thin"
codegen-units = 1
