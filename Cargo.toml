[package]
name = "gb"
version = "0.1.0"
edition = "2024"

[features]
default = ["sdl", "web", "llm"]
# The SDL2 desktop UI (`src/sdl/`): window, audio device, keyboard. On by default, so a plain
# `cargo build` is exactly what it always was. Off, the binary drops `libsdl2` and `fontdue`
# entirely — which is the point: a server-only container should not need a native SDL2 to link
# against, and `gb serve` never opens a window.
#   cargo build --release --no-default-features
sdl = ["dep:sdl2", "dep:fontdue"]
# Everything that leaves the process: the observation facade in `src/pokemon/observe.rs` serialised
# as JSON, the headless emulator host (`src/host.rs`) and the axum server (`src/web/`). `serde` and
# the server stack are optional because nothing in the emulator or the agent needs them — only the
# things that talk to the outside.
#
# `tokio` is here for `axum` and for the sync→async bridge only: the emulator and (from W4) the LLM
# worker are plain `std::thread`s and neither is ever inside a runtime.
#
# ⚠️ **On by default since W1**, which W0 deliberately did not do. The reason W0 gave — ~200 crates
# nothing compiles against and no test exercises — expired the moment `src/host.rs` and `src/web/`
# landed: the video codec, the late-joiner ordering and the host's publishing are all default-tier
# tests, and behind an opt-in feature a plain `cargo test --release` would silently skip every one of
# them. The cost is 57 extra crates on a build that already pulls 119. A server-only build still
# drops SDL entirely:
#   cargo build --release --no-default-features --features web
web = ["dep:serde", "dep:serde_json", "dep:tokio", "dep:tokio-stream", "dep:axum", "dep:base64", "dep:rust-embed"]
# **W4** — the LLM: the OpenAI-compatible client (`src/llm/`) and the policy that drives the game
# from it (`src/pokemon/llm_policy.rs`). Implies `web`, because the turn loop publishes into the same
# `Published` buffers the browser reads and there is no configuration in which one is wanted without
# the other.
#
# ⚠️ **In `default` for the reason `web` is**, and it is the same argument a third time: every W4 test
# — the SSE parser, the cancellation contract, the tool scoping, the mock-server playthrough — lives
# in this module, and behind an opt-in feature a plain `cargo test --release` would run none of them.
# The measured cost is **14 crates** — ureq and its rustls/ring TLS stack, most of whose transitive
# dependencies the build already had — against the 175 without it, and it needs no system library
# beyond a C compiler for `ring`. A container build is still
# `--no-default-features --features llm`.
llm = ["web", "dep:ureq"]
# The Pokémon integration tests are tiered by how much game time they emulate. The emulator runs at
# ~23x realtime, so game time is the cost: a plain `cargo test --release` stays under a minute by
# running only the mechanic tests and two navigation smoke tests.
#
# Every per-badge leg test (`can_reach_vermilion` … `can_enter_hall_of_fame`), each seeded from a
# committed `src/pokemon/data/*.bin` snapshot.
#   cargo test --release --features slow-tests
slow-tests = []
# The legs that cost more game time than the rest of `slow-tests` combined, so one of them does not
# silently become the tier's wall clock. Currently one: `postgame::safari::can_sweep_the_safari_zone`
# at 381 s, against 65 s for the next slowest leg and ≤65 s for the other 114 — it emulates ~190 min
# of game time buying 21 ¥500 Safari trips to chase 4.3 %-slot species, and there is no waste in it to
# reclaim. Its siblings in `slow-tests` still cover every Safari *mechanism*; see the test's docs.
#   cargo test --release --features very-slow-tests --bin gb -- can_sweep_the_safari_zone --exact
very-slow-tests = []
# `full_playthrough` alone — a fresh save played to all 8 badges and Victory Road 2F (NOT the Hall of
# Fame: the Elite Four is proved separately), ~20 min of wall clock. Kept off the `slow-tests` gate so
# the leg chain can be run without paying for it. Run it after every major work item and before pushing
# — it is the only test that proves the legs compose. See CLAUDE.md.
#   cargo test --release --features full-playthrough full_playthrough
full-playthrough = []
# Diagnostics and probes: tools that print a report about the game or the agent, not assertions.
# Compiled out by default so the ignored-test list stays a readable backlog of genuinely blocked
# work. They keep `#[ignore]` on top of the gate because their pass/fail is not a signal — several
# legitimately end by exhausting their cycle budget after printing what they were asked for.
#   cargo test --release --features diagnostics,slow-tests --bin gb -- probe_ --ignored --nocapture
diagnostics = []
# Benchmarks. Compiled out entirely by default rather than `#[ignore]`d, so they do not show up
# in the ignored count alongside genuinely blocked tests.
#   cargo test --release --features bench --bin gb -- bench_ --nocapture
bench = []
# Let tests overwrite the committed fixtures they snapshot. Off by default: a normal test run must
# leave the working tree clean, or every run silently changes the next run's inputs.
#   cargo test --release --features regen-fixtures,slow-tests
regen-fixtures = []
# The mooneye MBC test ROMs (D10) — 28 ROMs, 22 MB raw. They are committed **lz4-compressed** to
# `src/roms/mooneye/` (~90 KB) because they are almost entirely padding, and decompressed at test
# time. Gated because that decompression is pure cost for anyone not running them.
#   cargo test --release --features hwtests --bin gb -- mooneye
hwtests = []

[dependencies]
strum = "0.27"
strum_macros = "0.27.2"
paste = "1.0"
sdl2 = { version = "0.38", optional = true }
image = "0.25"
# ⚠️ Not SDL-only, despite living next to it in an earlier survey: `src/ppu.rs`,
# `src/pokemon/mod.rs` and `src/pokemon/map_header.rs` all use it, so it stays unconditional.
itertools = "0.14"
fontdue = { version = "0.9.3", optional = true }
bitflags = "2.9.3"
bincode = "2.0.1"
lz4_flex = "0.11"
unicode-segmentation = "1.12.0"
rand = "0.10.0-rc.0"
phf = { version = "0.13.1", features = ["macros"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
# The HTTP server only. `rt-multi-thread` because axum's serve wants a reactor; the emulator thread
# is spawned with `std::thread` and never enters it.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal"], optional = true }
# `BroadcastStream` — the sync→async bridge in stream form, and the only thing that surfaces
# `Lagged` so a viewer that fell out of the video ring buffer can be re-synced from a keyframe
# instead of silently keeping a stale screen.
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
axum = { version = "0.8", optional = true }
base64 = { version = "0.22", optional = true }
# The built SPA (`web/dist`), baked into the binary so the container is one file. ⚠️ The folder must
# exist at compile time — `web/dist/.gitkeep` is committed for exactly that reason, and a checkout
# that has not run `npm run build` compiles fine and serves a page saying so.
rust-embed = { version = "8.12", optional = true }
# The chat completions client. **Blocking on purpose**: `Response::into_reader()` is a plain
# `impl Read`, so streaming SSE is a `BufReader::lines()` loop on the worker's own `std::thread` and
# there is no second async runtime in the process. `reqwest::blocking` would start one internally.
ureq = { version = "3.3", optional = true }

[build-dependencies]
regex = "1.12.2"

# The integration tests are bound by raw emulation speed — the agent's observe/policy/input work is
# only ~16% on top of it — so these two are the only knob that makes every test faster at once.
# Re-measured 2026-08-05 after Phase A: 33.6x realtime raw, 28.3x with the agent. `-C
# target-cpu=native` was tried on top of this and made it *slower*, so it is deliberately not set.
[profile.release]
lto = "thin"
codegen-units = 1
