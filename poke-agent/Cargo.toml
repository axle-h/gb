[package]
name = "poke-agent"
version = "1.0.0"
edition = "2024"
description = "Plays Pokémon Red on a gb emulator, through the game's own memory."

[features]
# The per-badge legs, the playthroughs, the soak, the coverage walk and the probes.
slow-tests = []

[dependencies]
gb = { path = "../gb" }
base64 = "0.22"
bitflags = "2.9.3"
flate2 = "1"
image = "0.25"
itertools = "0.14"
rand = "0.10.0-rc.0"
rhai = { version = "1.26", features = ["no_time", "no_custom_syntax"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = "0.27"
strum_macros = "0.27.2"
# `broadcast`, for the two senders in `published.rs`. No runtime is ever entered here.
tokio = { version = "1", features = ["sync"] }
unicode-segmentation = "1.12.0"
# The chat completions client. Blocking, so streaming SSE needs no second async runtime.
ureq = "3.3"

[dev-dependencies]
# The mock endpoint in `pokemon/integration_tests/llm_harness.rs`.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }

[build-dependencies]
regex = "1.12.2"
